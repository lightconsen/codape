name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - 'NOTICE'
  # Deliberately no `paths-ignore` here. The `main` ruleset requires these
  # checks before a merge, and a required check that is never reported does not
  # count as passing — it sits "Expected" forever. A workflow skipped by a path
  # filter does not report anything, so a documentation-only pull request would
  # be unmergeable. Running the matrix for a docs change costs a few minutes of
  # free minutes; a branch that good changes cannot merge into costs more.
  # `push` keeps the filter: after such a pull request merges, the same commit
  # does not need to be tested again.
  pull_request:
    branches: [main]
  schedule:
    # Nightly: tests and checks only (the release build is gated below).
    - cron: "17 3 * * *"
    # Weekly: also runs the release build matrix.
    - cron: "42 4 * * 1"
  workflow_dispatch:
    inputs:
      live_provider:
        description: "Optional live provider smoke target"
        required: false
        default: "none"
        type: choice
        options:
          - none
          - kimi
          - qwen
      release_build:
        description: "Run the release build matrix (three OSes, expensive)"
        type: boolean
        default: false

# One run per ref. A newer push (or PR update) cancels the run it replaced;
# the previous result is no longer interesting and this keeps the queue short.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# `Swatinem/rust-cache` is configured below with `save-if: github.ref ==
# 'refs/heads/main'`, so only the default branch writes caches. Every pull
# request has its own ref, and a cache written under `refs/pull/N/merge` is
# restorable by that ref alone, so sixteen jobs per pull request each
# accumulated a full copy nobody could reuse. They grew the repository past the
# 10 GB Actions cache limit, and GitHub then evicted the largest entries to stay
# under it -- including `v0-rust-coverage-*` at 1.5 GB. A pull request could
# then only cold-build the workspace (603 crates instead of 21), and its
# Coverage job ran long enough to be canceled. Reading is unaffected: a pull
# request restores its base branch's caches, so this keeps the reuse and drops
# the duplication.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Tests do not need debug info. Without this the wasmtime test binaries
  # overflow the hosted runner's disk and linking fails mid-build.
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Cassette metadata is cheap to check and expensive to get wrong: a recording
  # that quietly answers a different prompt makes every test using it pass for
  # the wrong reason.
  cassettes:
    name: Cassette metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Check cassette metadata
        run: python3 scripts/cassette_tool.py check --strict

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - uses: ./.github/actions/linux-deps
      # The backlog is empty (see docs/verification.md), so a warning is a
      # regression. `--all-targets` includes test and bench code; the toolchain
      # is pinned in rust-toolchain.toml so a new stable release cannot add a
      # lint that fails a build for reasons unrelated to the change.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The jobs build default features. `keyring`, `hot-reload` and
      # `wasm-runtime` are optional and are upgraded independently, so compile
      # one workspace with every feature enabled as well.
      - name: Check optional features compile
        run: cargo check --workspace --all-features --locked

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Linking the whole workspace at once exhausts the runner's memory.
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - uses: taiki-e/install-action@nextest
      # Two steps instead of one. Running the whole workspace in a single
      # `nextest` call starts all 125 test binaries at once, and on the hosted
      # runner that reliably ends the job: `nextest` logs "Cancelling due to
      # signal" 1.2-1.6s after "Starting 4685 tests across 125 binaries", at
      # index 424, with the runner's own cancellation behind it. It is not one
      # test's fault and not a concurrency limit — `--test-threads 2` moved the
      # instant (1.47s to 2.64s) but not the index, and the same four tests
      # (two `coderex-bridge`, two `coderex-cli::bridge_launcher`) were the ones
      # in flight every time.
      #
      # Splitting the call is what changes the outcome: 3967 tests across 61
      # binaries and 718 across 64 both complete, every test runs exactly once,
      # and the totals still add up to the full suite. The same split fixes
      # `Coverage`, which died at the same index under `cargo llvm-cov nextest`.
      #
      # `--no-fail-fast` reports every failing test binary instead of stopping
      # at the first failure; one red run should name all of them.
      #
      # This split does NOT make the SIGTERM class of failure go away. The
      # earlier fingerprint (index 424 of one 125-binary call) is gone, but the
      # same shape now lands on this second call: the runner receives a shutdown
      # signal and nextest reports "Cancelling due to signal" 0.05-0.07s after
      # "Starting 718 tests across 64 binaries", always at index 13-16, always
      # the same four `bridge_launcher` tests. It happens on `main` too, and the
      # same commit has both passed and failed, so it is not a test's fault.
      # See issue #25. `rerun-cancelled` below re-runs the job when this
      # happens; do not treat a cut-off `Test`/`Coverage` as a regression
      # signal.
      - name: Test (everything but coderex-cli)
        run: cargo nextest run --workspace --no-fail-fast --locked -E 'not package(coderex-cli)'
      # DIAGNOSTIC PROBE — temporary, remove once issue #25 is answered.
      #
      # Shape of the failure, measured rather than guessed:
      #
      #   * Cancellation lands 52-66 ms after "Starting 718 tests across 64
      #     binaries", always at indices 13-16, always the same four
      #     `bridge_launcher` tests. Test and Coverage both do it, on
      #     different machines, about two minutes apart within one run.
      #   * The offset from *job start* is not merely noisy, it is unrelated:
      #     262 s, 840 s, 286 s for the three most recent runs. So this is not
      #     a runner quota, a job timeout, or anything scheduled from outside.
      #     The trigger is anchored to this nextest invocation.
      #   * A run-level cancel is ruled out by Test and Coverage dying ~2 min
      #     apart, each 62 ms after its *own* second call.
      #   * nextest prints "Cancelling due to signal" before its own SIGTERM
      #     result lines, and two of the four caught tests have no child
      #     process and no signal code at all — the tests are receivers.
      #   * The runner logs "received a shutdown signal" 3-11 ms *after*
      #     nextest reports the cancellation, i.e. both processes were hit
      #     essentially at once.
      #
      # That last point is the fork in the road and the only thing this probe
      # has to settle: did the step shell receive SIGTERM too?
      #
      #   * Shell got it, alongside nextest and the runner -> the signal went
      #     to a group, session, or cgroup above all of them. The sender is
      #     outside this step (runner/platform side), and no code change here
      #     can prevent it.
      #   * Shell did not, only nextest and the runner did -> the sender is a
      #     descendant of the step, and the `bridge_launcher` tests that create
      #     process groups are back on the table as the source.
      #
      # Process groups and sessions do not change during a run, so this does
      # not need to catch the exact millisecond; it samples continuously and
      # records the step shell's own pid/pgid/sid first, as the reference
      # point every sample is compared against.
      #
      # Earlier drafts of this probe were defeated by two details, both fixed
      # here: a background subshell writing to a pipe is block-buffered, so the
      # last ~4 KB vanished exactly when SIGTERM landed (every sample now goes
      # to a file with `>>`, which is durable immediately), and a probe step
      # guarded by `if: always()` never runs at all, because a job-level
      # cancellation skips `Post Run` steps too.
      #
      # If this comes back inconclusive, the next instrument is
      # `strace -f -e trace=signal` around the nextest call, which reports the
      # sender pid in `si_pid` directly. It is held in reserve because it slows
      # the run and may stop a timing-sensitive failure from reproducing.
      #
      # The exit status is passed through unchanged, so the step still fails
      # exactly as before.
      - name: Test (coderex-cli)
        run: |
          set +e

          log=/tmp/probe.log
          : > "$log"
          # The TERM handler both dumps and exits, and `exit` runs the EXIT
          # trap as well, so without this guard the whole dump prints twice
          # and the second copy buries the first under 120 lines of process
          # table.
          dumped=0

          dump() {
            # Command substitution runs in a subshell, and a subshell inherits
            # the EXIT trap with its own copy of `dumped` still at 0. Without
            # this, every `$(...)` in the script fires its own dump -- three
            # copies of the whole report, two of them from subshells that
            # never saw the signal. `$$` is the main shell's pid in both, so
            # `$BASHPID` is what distinguishes them.
            [ "$$" = "$BASHPID" ] || return 0
            [ "$dumped" = 0 ] || return 0
            dumped=1
            echo "=== process tree at step start ==="
            cat /tmp/tree.txt 2>/dev/null | head -60
            echo "=== what the step shell recorded ==="
            cat "$log" 2>/dev/null
            # Delivery lines look like
            #   `1234 12:00:00.123 --- SIGTERM {si_signo=SIGTERM, ...} ---`
            # and carry `si_pid`, the sender. Matching the bare word SIGTERM
            # also catches `rt_sigaction(SIGTERM, ...)`, which most programs
            # call during setup and which says nothing about delivery.
            echo "=== strace: signals delivered (si_pid names the sender) ==="
            grep -E -- '--- SI[A-Z]+ \{si_signo=' /tmp/strace.log 2>/dev/null | head -40 \
              || echo "(no signal delivered to a traced process)"
            echo "=== strace: signal sends from traced processes ==="
            grep -E '(kill|tgkill|tkill)\(' /tmp/strace.log 2>/dev/null | head -40 \
              || echo "(none)"
            # A signal that reaches the step shell, nextest and the runner at
            # the same instant did not come from a descendant: `cargo nextest`
            # gives every test binary its own process group, so the worst a
            # test can do is end its own binary. That leaves something above
            # the step, and the one thing that both explains the blast radius
            # and would fire exactly when 64 test binaries start at once is
            # memory pressure. These files are the record of it, and unlike
            # strace they are written by the kernel, so they survive the
            # processes that read them.
            echo "=== memory ==="
            free -m 2>/dev/null || true
            for f in /sys/fs/cgroup/memory.current \
                     /sys/fs/cgroup/memory.peak \
                     /sys/fs/cgroup/memory.max \
                     /sys/fs/cgroup/memory.events \
                     /sys/fs/cgroup/memory.events.local \
                     /sys/fs/cgroup/memory.swap.current; do
              [ -r "$f" ] && echo "$f: $(cat "$f" 2>/dev/null | tr '\n' ' ')"
            done
            echo "=== kernel log: oom / kill ==="
            sudo dmesg 2>/dev/null | grep -iE 'oom|killed process|out of memory' | tail -20 \
              || echo "(no oom entries, or dmesg not readable)"
          }
          trap dump EXIT
          # A job-level cancellation runs EXIT but not `Post Run` steps, so the
          # dump has to happen on the way out rather than in a later step. The
          # marker line is the whole point: if the shell itself was hit, the
          # signal was aimed at a group containing it. SIGHUP is trapped too
          # because the runner sends HUP on some cancellation paths; an
          # untrapped HUP kills the shell before it can write anything.
          trap 'echo "!!! step shell received SIGTERM" >> "$log"; dump; exit 143' TERM
          trap 'echo "!!! step shell received SIGHUP" >> "$log"; dump; exit 129' HUP

          echo "step shell pid=$$ ppid=$PPID pgid=$(ps -o pgid= -p $$ | tr -d ' ') sid=$(ps -o sid= -p $$ | tr -d ' ')" | tee "$log"
          ps -eo pid,ppid,pgid,sid,comm,args --sort=pid > /tmp/tree.txt 2>/dev/null

          # `strace -f -e trace=signal` prints `si_pid` for every signal a
          # traced process receives, which names the sender instead of leaving
          # it to be inferred from process groups. It is preinstalled on the
          # hosted image; the install is only a fallback and is allowed to
          # fail, because a missing ptrace must not turn into a missing test
          # run.
          command -v strace >/dev/null 2>&1 \
            || sudo apt-get install -y -qq --no-install-recommends strace >/dev/null 2>&1

          if command -v strace >/dev/null 2>&1; then
            echo "running under strace"
            strace -f -tt -s 0 -e trace=signal -o /tmp/strace.log -- \
              cargo nextest run -p coderex-cli --no-fail-fast --locked
            status=$?
            if [ "$status" = 1 ] && [ ! -s /tmp/strace.log ]; then
              # strace itself failed (ptrace refused, or a bad option): rerun
              # untraced so the job still reports whatever nextest says.
              echo "strace produced nothing; rerunning untraced"
              cargo nextest run -p coderex-cli --no-fail-fast --locked
              status=$?
            fi
          else
            echo "strace unavailable; running untraced"
            cargo nextest run -p coderex-cli --no-fail-fast --locked
            status=$?
          fi

          echo "nextest exited with $status" | tee -a "$log"
          exit "$status"

  # `cargo nextest` does not run doctests, and a `cargo test` in another job
  # would run them only incidentally. A doc example that stops compiling is a
  # broken promise to every reader of the API docs, so it gets its own step.
  doctests:
    name: Doctests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - run: cargo test --doc --workspace --locked

  # The plist managed-settings carrier is `#[cfg(target_os = "macos")]`, so no
  # Linux or Windows job ever compiles it. Without this job those tests never
  # run anywhere.
  test-macos:
    name: Test (macOS plist carrier)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      - run: cargo test -p coderex-config --locked
      # The live benchmark cassettes replay sessions recorded on macOS; one of
      # them repairs its fixture with BSD `sed -i ''`, which GNU sed rejects.
      # The case is gated to macOS, so it runs here.
      - name: Live benchmark replay
        run: cargo test -p coderex-cli --test code_agent_benchmark live_ --locked
      # macOS-only code (sandbox-exec, F_GETPATH, the plist carrier) is not
      # compiled on Linux, so the main clippy job never sees it.
      - name: Clippy (macOS)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # The release matrix builds a target that nothing else does: musl. Its libc
  # differs from glibc's in ways a gnu build cannot see (the rlimit resource
  # type is `c_int` there and `c_uint` here), and the first v0.1.0 tag found
  # exactly that. This job type-checks the workspace for musl on every push so
  # the release does not have to be the first place it is compiled.
  cross-check-musl:
    name: Cross-check (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-unknown-linux-musl
      - uses: ./.github/actions/linux-deps
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Check the workspace for musl
        run: cargo check --workspace --target x86_64-unknown-linux-musl --locked

  # The SSH spawn path talks to a real sshd. Its unit tests cover the mapping
  # and the command list; only a live server covers the connection, the
  # identity file and the remote `mkdir`/`which`. The job starts a throwaway
  # sshd on a high port and points the test at it.
  ssh-integration:
    name: SSH spawn (real sshd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps

      - name: Start a throwaway sshd
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo mkdir -p /run/sshd
          # The hosted runner's account is locked (`!` in shadow), and sshd
          # refuses a locked account even for key auth. Give it a password
          # nobody knows; PasswordAuthentication stays off.
          echo "runner:$(openssl rand -hex 16)" | sudo chpasswd
          ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh_host_key
          ssh-keygen -q -t ed25519 -N '' -f /tmp/ssh_client_key
          cp /tmp/ssh_client_key.pub /tmp/authorized_keys
          # sshd runs as root and refuses a host key owned by anyone else.
          sudo chown root:root /tmp/ssh_host_key
          sudo chmod 600 /tmp/ssh_host_key /tmp/authorized_keys
          sudo /usr/sbin/sshd -D -e -p 2222 -h /tmp/ssh_host_key \
            -o "AuthorizedKeysFile=/tmp/authorized_keys" \
            -o "StrictModes=no" -o "PasswordAuthentication=no" -o "UsePAM=no" \
            > /tmp/sshd.log 2>&1 &
          # The spawner verifies the remote has coderex; the check only needs
          # something executable with that name.
          sudo install -m 755 /bin/true /usr/local/bin/coderex
          echo "CODEREX_SSH_TEST_HOST=$(whoami)@localhost:2222" >> "$GITHUB_ENV"
          echo "CODEREX_SSH_TEST_KEY=/tmp/ssh_client_key" >> "$GITHUB_ENV"
          echo "CODEREX_SSH_TEST_PATH=/tmp/coderex-ssh-test" >> "$GITHUB_ENV"
          : > /tmp/ssh-client.log
          for _ in $(seq 1 30); do
            if ssh -p 2222 -i /tmp/ssh_client_key \
              -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o BatchMode=yes -o ConnectTimeout=2 \
              "localhost" true 2>>/tmp/ssh-client.log; then
              echo "sshd is up"
              exit 0
            fi
            sleep 1
          done
          echo "sshd did not answer:" >&2
          cat /tmp/sshd.log >&2 || true
          tail -30 /tmp/ssh-client.log >&2 || true
          exit 1

      - name: Spawn a session over SSH
        run: cargo test -p coderex-bridge --test ssh_spawn --locked -- --nocapture

  # Compilation and linking for Windows are required, and are checked from
  # ubuntu-latest with the mingw-w64 toolchain below. This matters because the
  # Unix jobs never compile the `cfg(target_os = "windows")` paths; a break in
  # them would otherwise only appear in the (advisory) runtime job.
  cross-check-windows:
    name: Cross-check (Windows)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - name: Check the workspace for Windows
        run: cargo check --workspace --target x86_64-pc-windows-gnu --locked
      - name: Link the Windows test binaries
        run: >
          cargo test --no-run --lib --target x86_64-pc-windows-gnu --locked
          -p coderex-core -p coderex-tools -p coderex-hooks
          -p coderex-config -p coderex-cli

  # The Unix test job cannot execute the Windows-only sandbox tests: they are
  # `cfg(target_os = "windows")`, and the `build` matrix only compiles. This
  # job runs the AppContainer confinement tests, the shell and hook sandbox
  # paths, the managed-settings (HKLM) code, and the CLI library tests on a
  # Windows host.
  #
  # Compilation and linking are required by `cross-check-windows`; this job
  # runs the runtime tests and is required too. It was advisory while the
  # AppContainer paths had no passing history — the intermittent 10-minute
  # timeout turned out to be sandbox creation spending 488s rewriting every
  # ancestor DACL, since fixed. It now takes about 39s.
  #
  # `--no-fail-fast` runs every remaining test binary in an invocation, and
  # `if: always()` keeps a failing crate from hiding the crates after it.
  test-windows:
    name: Test (Windows runtime)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CODEREX_REQUIRE_APP_CONTAINER: '1'
      CODEREX_REQUIRE_HKLM_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy
      # Production Windows code (the AppContainer paths) is not compiled on
      # Linux either. `--all-targets` is deliberately omitted: the CLI
      # integration tests are POSIX-shell fixtures and are not built here.
      - name: Clippy (Windows)
        run: cargo clippy --workspace --locked -- -D warnings
      - name: Core sandbox tests (AppContainer)
        timeout-minutes: 20
        run: >
          cargo test --no-fail-fast -p coderex-core --lib sandbox --locked -- --nocapture
          --skip windows_sandbox_confines_a_suspended_child
          --skip spawn_in_container_confines_a_real_process
      - name: AppContainer confinement (suspended child)
        if: always()
        timeout-minutes: 10
        run: >
          cargo test --no-fail-fast -p coderex-core --lib --locked
          sandbox::tests::windows_sandbox_confines_a_suspended_child
          -- --exact --nocapture
      - name: AppContainer confinement (STARTUPINFOEX)
        if: always()
        timeout-minutes: 10
        run: >
          cargo test --no-fail-fast -p coderex-core --lib --locked
          sandbox_windows::tests::windows::spawn_in_container_confines_a_real_process
          -- --exact --nocapture
      - name: Process tree tests (Job Objects)
        if: always()
        timeout-minutes: 10
        run: cargo test --no-fail-fast -p coderex-core --lib process_tree --locked -- --nocapture
      - name: Tools shell sandbox tests
        if: always()
        timeout-minutes: 15
        run: cargo test --no-fail-fast -p coderex-tools sandbox --locked -- --nocapture
      # `fd_path` (GetFinalPathNameByHandleW) is the Windows half of the
      # verified-file story; macOS has F_GETPATH and a test, Windows had
      # neither until this step.
      - name: Verified file-access tests
        if: always()
        timeout-minutes: 10
        run: cargo test --no-fail-fast -p coderex-tools --lib verified_fs --locked -- --nocapture
      - name: Hooks sandbox tests
        if: always()
        timeout-minutes: 10
        run: cargo test --no-fail-fast -p coderex-hooks sandbox --locked -- --nocapture
      - name: MCP sandbox tests
        if: always()
        timeout-minutes: 15
        run: cargo test --no-fail-fast -p coderex-mcp --lib windows_ --locked -- --nocapture
      # The whole crate, not just `archive`: the spawner, poller and
      # orchestrator tests are portable and used to run only on Unix, which
      # left the Windows spawn path with no runtime coverage. `ssh_spawn` is
      # `#![cfg(unix)]` because the openssh crate is Unix-only; on Windows that
      # target is an empty test binary rather than a skipped failure.
      - name: Bridge tests
        if: always()
        timeout-minutes: 20
        run: cargo test --no-fail-fast -p coderex-bridge --locked -- --nocapture
      - name: WASM compiler sandbox tests
        if: always()
        timeout-minutes: 20
        run: cargo test --no-fail-fast -p coderex-plugins --test wasm_compile_subprocess --locked -- --nocapture
      - name: Config tests (Windows registry path)
        if: always()
        timeout-minutes: 10
        run: cargo test --no-fail-fast -p coderex-config --locked -- --nocapture
      - name: CLI library tests
        if: always()
        timeout-minutes: 20
        run: cargo test --no-fail-fast -p coderex-cli --lib --locked -- --nocapture

  # Line coverage, uploaded as an artifact and reported on pull requests.
  #
  # The number is compared with the baseline recorded in docs/coverage.md
  # (updated when the figure moves) so a PR sees "87.0% -> 86.4%". A drop
  # below COVERAGE_MIN fails the job; a downward drift above it is reported
  # rather than failed, because a refactor can legitimately move coverage
  # around. The comment is posted only for pull requests from this repository:
  # a fork's pull request has a read-only token.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    env:
      CARGO_BUILD_JOBS: '2'
      COVERAGE_MIN: '85'
    steps:
      - uses: actions/checkout@v7
      # `cache-on-failure` matters here more than in any other job: `Measure`
      # is one long `cargo llvm-cov` that builds the whole workspace for the
      # instrumented profile and then runs every test. When it fails or is
      # cancelled, the default `cache-on-failure: false` skips the save, so the
      # next run starts cold again — a cold build takes far longer, which makes
      # another failure more likely, which skips the save again. Saving the
      # partial `target/llvm-cov-target` on failure is what breaks that loop.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          cache-on-failure: 'true'
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - uses: taiki-e/install-action@cargo-llvm-cov
      # `scripts/coverage.sh` measures with `cargo llvm-cov nextest` when
      # nextest is present, so each test binary runs in its own process group
      # — the same isolation the `Test` job gets. Without this the run falls
      # back to `cargo test`, where every binary shares the runner's group.
      - uses: taiki-e/install-action@nextest
      - name: Measure
        run: scripts/coverage.sh
      - name: Compare with the baseline
        id: compare
        run: |
          total=$(awk -F'\t' '{hit += $2; lines += $3} END {printf "%.1f", 100 * hit / lines}' \
            target/coverage/coverage.tsv)
          baseline=$(sed -n 's/.*= \([0-9][0-9.]*\)%.*/\1/p' docs/coverage.md | head -1)
          baseline="${baseline:-0}"
          delta=$(awk -v t="$total" -v b="$baseline" 'BEGIN {printf "%+.1f", t - b}')
          echo "total=$total" >> "$GITHUB_OUTPUT"
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          echo "delta=$delta" >> "$GITHUB_OUTPUT"
          echo "workspace coverage: ${total}% (baseline ${baseline}%, ${delta} points)"
          {
            echo "<!-- coderex-coverage -->"
            echo "### Coverage"
            echo
            echo "Workspace line coverage: **${total}%** (baseline \`${baseline}%\`, ${delta} points)."
            echo
            echo "<details><summary>Per crate</summary>"
            echo
            cat target/coverage/summary.md
            echo
            echo "</details>"
            echo
            echo "The lcov report is attached to this run as \`coverage-lcov\`."
          } > target/coverage/comment.md
      - name: Enforce the floor
        run: |
          total="${{ steps.compare.outputs.total }}"
          min="$COVERAGE_MIN"
          if awk -v t="$total" -v m="$min" 'BEGIN {exit !(t < m)}'; then
            echo "coverage ${total}% is below the ${min}% floor" >&2
            exit 1
          fi
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: |
            target/coverage/lcov.info
            target/coverage/summary.md
            target/coverage/comment.md
          if-no-files-found: warn
      - name: Comment on the pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('target/coverage/comment.md', 'utf8');
            const marker = '<!-- coderex-coverage -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  code-agent-benchmark:
    name: Code Agent Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - run: scripts/test-code-agent-benchmark.sh mock

  evals:
    name: Eval Harness
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - name: Build eval fixtures
        run: cargo build -p coderex-cli --bin coderex --bin static-anthropic-server --locked
      - name: Run checked-in smoke flow
        run: |
          cargo run --locked -p coderex-evals --bin run-eval -- \
            --flow-dir evals/flows/smoke \
            --variant baseline \
            --approve-harness \
            --force
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: eval-report
          path: |
            evals/flows/smoke/report.html
            evals/flows/smoke/baseline/results.jsonl
          if-no-files-found: warn

  nightly-mock-depth:
    name: Nightly Mock Depth
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - run: scripts/test-interactive-mock.sh full
      - run: cargo test -p coderex-cli --test e2e_stress --locked -- --nocapture

  # Soak and fuzz: long-running checks that are pointless on every push but
  # catch the failures a unit test cannot — a session that leaks descriptors
  # over many turns, a parser that panics on a crafted input. Schedule and
  # manual dispatch only.
  nightly-soak-and-fuzz:
    name: Nightly Soak & Fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      SOAK_TURNS: '50'
      SOAK_OUTPUT_DIR: target/soak
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: ./.github/actions/linux-deps
      - name: Soak a long session
        run: python3 scripts/soak.py
      - name: Symlink/rename churn (single process)
        run: scripts/race-soak.sh 5000
      - name: Symlink/rename churn (four processes)
        run: scripts/race-soak-multi.sh 4 5000 2
      # `uses: taiki-e/install-action@cargo-fuzz` never installed anything.
      # `cargo-fuzz` is a repository *branch*, not a published tag, and the
      # action's `tool` input defaults to a placeholder (`# default:
      # #publish:tool`) that only the release process rewrites into a tool
      # name. On the branch it is still the placeholder, so `INPUT_TOOL` was
      # empty: the step warned "no tool specified" and exited 0 in 13 ms, and
      # `scripts/fuzz.sh` then failed with "cargo-fuzz is not installed".
      #
      # Reaching for `tool: cargo-fuzz` on `@v2` is not a fix either. The
      # action only falls back to `cargo-binstall` for a tool it does not
      # know, and `cargo-fuzz` publishes prebuilt tarballs with no binstall
      # metadata in its manifest to point at them, so the fallback has nothing
      # to resolve. `cargo install` is what the tool's own error message
      # suggests, and the nightly toolchain this job already installs is the
      # one `scripts/fuzz.sh` compiles the targets with.
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Fuzz the parsers
        run: scripts/fuzz.sh 120
      - name: Upload soak and fuzz reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-soak-and-fuzz
          path: |
            target/soak
            fuzz/artifacts
          if-no-files-found: warn

  live-provider-smoke:
    name: Live Provider Smoke
    if: github.event_name == 'workflow_dispatch' && inputs.live_provider != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODEREX_SKIP_ENV_SOURCE: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - run: scripts/test-interactive-live.sh "${{ inputs.live_provider }}" smoke
      - run: scripts/test-code-agent-benchmark.sh live "${{ inputs.live_provider }}"

  # `secrets` cannot be used in a job-level `if:`, so a tiny preflight turns
  # "is ANTHROPIC_API_KEY present?" into an output the live job can gate on.
  # Both jobs are workflow_dispatch only: a push or pull request never reaches
  # them, and a repository without the secret skips the eval instead of
  # failing it.
  live-provider-eval-preflight:
    name: Live Provider Eval (credentials)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check for provider credentials
        id: check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY is not configured; live-provider-eval is skipped."
          fi

  live-provider-eval:
    name: Live Provider Eval
    if: github.event_name == 'workflow_dispatch' && needs.live-provider-eval-preflight.outputs.configured == 'true'
    needs: live-provider-eval-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CODEREX_SKIP_ENV_SOURCE: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANTHROPIC_MODEL: ${{ secrets.ANTHROPIC_MODEL }}
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      - name: Run the live-provider eval flow
        run: scripts/test-live-eval.sh
      - name: Upload live eval report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-eval-report
          path: |
            evals/flows/live/report.html
            evals/flows/live/baseline/results.jsonl
          if-no-files-found: warn

  doc:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: ./.github/actions/linux-deps
      # The rustdoc backlog is empty; a warning is a regression.
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: License & Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check licenses bans sources

  build:
    name: Build
    # The release build is the most expensive part of the matrix: one run cost
    # roughly 2/3 of the day's billed minutes (Windows ~48 min at a 2x
    # multiplier, macOS ~10 min at 10x). It runs for tagged releases, the
    # weekly schedule, and a manual dispatch that explicitly asks for it —
    # never on an ordinary push or pull request.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || github.event.schedule == '42 4 * * 1'
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_build == 'true')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: dtolnay/rust-toolchain@1.99.1
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps
      - run: cargo build --workspace --release --locked
