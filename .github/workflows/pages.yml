name: Pages

# Builds site/ and publishes it to GitHub Pages at codape.com.
#
# Scoped to site/** on push, because this repository's `main` is otherwise a
# Rust workspace and a docs-only or crate-only merge should not redeploy the
# marketing page. There is no `paths-ignore` on `pull_request` for the same
# reason there is none in ci.yml: a required check that never reports leaves the
# pull request unmergeable.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# Pages allows one deployment at a time. Queue rather than cancel: a cancelled
# run mid-deploy can leave the environment reporting a failed deployment.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # `pnpm build` type-checks with tsc before Vite bundles, so a type error
      # fails here rather than shipping a broken page.
      - name: Build
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
