[package]
name = "codape-mcp"
version = "0.2.0"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "MCP server lifecycle, tool discovery, resources, OAuth, elicitation"

[lints]
workspace = true

[dependencies]
codape-core = { path = "../core" }
codape-config = { path = "../config", features = ["keyring"] }
codape-tools = { path = "../tools" }

thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
# `preserve_order` keeps `requestedSchema.properties` in the order the server
# declared them, which is the order the elicitation questions are asked in.
serde_json = { workspace = true, features = ["preserve_order"] }
dashmap.workspace = true
tokio-tungstenite.workspace = true
oauth2.workspace = true
reqwest.workspace = true
url.workspace = true
chrono.workspace = true
async-trait.workspace = true
regex.workspace = true
tokio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
codape-test-utils = { path = "../test-utils" }
