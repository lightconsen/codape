[package]
name = "codape-cli"
version = "0.1.3"
publish = false
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "CLI binary — startup orchestrator, REPL loop, CLI subcommands"

[lints]
workspace = true

[[bin]]
name = "codape"
path = "src/main.rs"

[[bin]]
name = "mock-anthropic-server"
path = "src/bin/mock_anthropic_server.rs"

[[bin]]
name = "record-anthropic-responses"
path = "src/bin/record_anthropic_responses.rs"

[[bin]]
name = "static-anthropic-server"
path = "src/bin/static_anthropic_server.rs"

[[bin]]
name = "llm-cassette"
path = "src/bin/llm_cassette.rs"

[[bin]]
name = "codape-interactive-e2e"
path = "src/bin/codape_interactive_e2e.rs"

[dependencies]
codape-core = { path = "../core" }
codape-tools = { path = "../tools" }
codape-agents = { path = "../agents" }
codape-commands = { path = "../commands" }
codape-hooks = { path = "../hooks" }
codape-mods = { path = "../mods" }
codape-memory = { path = "../memory" }
codape-mcp = { path = "../mcp" }
codape-artifacts = { path = "../artifacts" }
codape-events = { path = "../events" }
codape-workflow = { path = "../workflow" }
codape-plugins = { path = "../plugins" }
codape-bridge = { path = "../bridge" }
codape-server = { path = "../server" }
codape-ui = { path = "../ui" }
codape-config = { path = "../config" }
notify = { version = "8", optional = true }
codape-telemetry = { path = "../telemetry" }

clap.workspace = true
tokio.workspace = true
chrono.workspace = true
parking_lot.workspace = true
tokio-util = { workspace = true }
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
anyhow.workspace = true
home.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
reqwest.workspace = true
sha2.workspace = true
hex.workspace = true
tar.workspace = true
flate2.workspace = true
semver.workspace = true
tempfile.workspace = true
async-trait.workspace = true
crossterm.workspace = true
compact_str.workspace = true
uuid.workspace = true
portable-pty = "0.9"
vt100 = "0.15"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
compact_str.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true
codape-test-utils = { path = "../test-utils" }
futures.workspace = true
tokio-tungstenite.workspace = true

# ─── Release Tier Features ──────────────────────────────────────────────────
# Each tier enables everything below it.
#
#   cargo build --features core          # QueryEngine + baseline tools
#   cargo build --features full          # core + bridge/server/plugins
#   cargo build --features enterprise    # full + managed settings/team/trusted device
#

[features]
default = ["core", "hot-reload"]
core = []
full = ["core"]
hot-reload = ["dep:notify"]
enterprise = ["full", "codape-config/enterprise"]

[package.metadata.dist]
# The name cargo-dist uses for this binary
name = "codape"
# Whether to build this package in releases
dist = true
# The hosts to build for (inherits from workspace by default)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl", "x86_64-pc-windows-msvc"]
